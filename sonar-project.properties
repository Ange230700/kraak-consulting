# Configuration SonarQube Cloud (SonarCloud) — kraak-group
# Référence : https://docs.sonarsource.com/sonarqube-cloud/

sonar.projectKey=Ange230700_kraak-group
sonar.organization=ange230700
sonar.projectName=kraak-group
sonar.projectVersion=0.1
sonar.host.url=https://sonarcloud.io

# Encodage source
sonar.sourceEncoding=UTF-8

# Périmètre d'analyse
sonar.sources=apps,packages,scripts,supabase,.czrc.cjs,commit-scopes.cjs,commitlint.config.js,eslint.config.mjs,lint-staged.config.cjs
sonar.tests=apps,packages,scripts

# Exclusions globales
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.mjs,\
  **/*.spec.mjs,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.avif,\
  **/*.webp,\
  **/*.gif,\
  **/*.ico,\
  apps/client/projects/**/public/assets/runtime-config.js,\
  packages/contracts/src/db.types.ts,\
  docs/context/mermaid-artefacts/**,\
  supabase/migrations/**,\
  supabase/functions/**

# Inclusions de tests (BDD : *.spec.ts côté Angular/Nest, *.test.* côté scripts)
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.mjs,\
  **/*.spec.mjs

# Seuls les tests, templates et types générés sont hors couverture.
# Les seuils de 100 % par fichier sont imposés par c8, Jest et Vitest.
sonar.coverage.exclusions=\
  **/*.html,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.mjs,\
  **/*.spec.mjs,\
  apps/client/tests/**,\
  packages/contracts/src/db.types.ts

# Exclusions de duplication (CPD) sur les pages qui partagent volontairement
# une structure de composition similaire.
sonar.cpd.exclusions=\
  apps/client/projects/web/src/app/features/about/about.page.ts,\
  apps/client/projects/web/src/app/features/programs/programs.page.ts,\
  apps/client/projects/web/src/app/features/services/services.page.ts

# Rapports de couverture (LCOV)
sonar.javascript.lcov.reportPaths=\
  coverage/lcov.info,\
  apps/api/coverage/lcov.info,\
  apps/client/coverage/web/lcov.info,\
  apps/client/coverage/mobile/lcov.info,\
  packages/contracts/coverage/lcov.info,\
  packages/domain/coverage/lcov.info,\
  packages/api-client/coverage/lcov.info,\
  packages/tokens/coverage/lcov.info
sonar.typescript.lcov.reportPaths=\
  coverage/lcov.info,\
  apps/api/coverage/lcov.info,\
  apps/client/coverage/web/lcov.info,\
  apps/client/coverage/mobile/lcov.info,\
  packages/contracts/coverage/lcov.info,\
  packages/domain/coverage/lcov.info,\
  packages/api-client/coverage/lcov.info,\
  packages/tokens/coverage/lcov.info

# Ignore le faux positif shell:S6505 sur le script CI Playwright.
# Le script s'exécute dans un runner éphémère GitHub Actions et utilise déjà
# pnpm avec config ignore-scripts pour éviter les lifecycle scripts.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/install-playwright-browsers.sh

# Évite l'analyse PLSQL Oracle sur les migrations PostgreSQL (.sql).
# Cela supprime l'avertissement Data Dictionary non configuré pour les règles Oracle.
sonar.plsql.file.suffixes=.plsql,.pls,.pks,.pkb
