# render.yaml

# Configuration Render — services web statiques Angular prerender et API NestJS.
# Documentation : https://docs.render.com/blueprint-spec
#
# Services déclarés :
#   - kraak-web-prod    : front web statique Angular prerender.
#                         Auto-deploy désactivé ; usage production contrôlé.
#   - kraak-api-prod    : API NestJS Docker.
#                         Auto-deploy désactivé ; déclenchement production
#                         contrôlé par workflow de release/tag.
#
# Modèle Git actif :
#   - `main` est la seule branche permanente et reçoit les PR validées.
#   - les tags SemVer issus de `main` pilotent les déploiements contrôlés.
#   - développement et validation utilisent des services locaux éphémères.

services:
  - type: web
    name: kraak-web-prod
    runtime: static
    plan: free
    branch: main
    autoDeploy: false
    staticPublishPath: public
    renderSubdomainPolicy: enabled
    routes:
      - type: redirect
        source: /a-propos
        destination: /fr/a-propos
      - type: redirect
        source: /a-propos/
        destination: /fr/a-propos
      - type: redirect
        source: /services
        destination: /fr/services
      - type: redirect
        source: /services/
        destination: /fr/services
      - type: redirect
        source: /faq
        destination: /fr/faq
      - type: redirect
        source: /faq/
        destination: /fr/faq
      - type: redirect
        source: /programmes
        destination: /fr/programmes
      - type: redirect
        source: /programmes/
        destination: /fr/programmes
      - type: redirect
        source: /ressources
        destination: /fr/ressources
      - type: redirect
        source: /ressources/
        destination: /fr/ressources
      - type: redirect
        source: /contact
        destination: /fr/contact
      - type: redirect
        source: /contact/
        destination: /fr/contact
      - type: redirect
        source: /mentions-legales
        destination: /fr/mentions-legales
      - type: redirect
        source: /mentions-legales/
        destination: /fr/mentions-legales
      - type: redirect
        source: /politique-de-confidentialite
        destination: /fr/politique-de-confidentialite
      - type: redirect
        source: /politique-de-confidentialite/
        destination: /fr/politique-de-confidentialite
      - type: redirect
        source: /401
        destination: /fr/401
      - type: redirect
        source: /401/
        destination: /fr/401
      - type: redirect
        source: /403
        destination: /fr/403
      - type: redirect
        source: /403/
        destination: /fr/403
      - type: redirect
        source: /404
        destination: /fr/404
      - type: redirect
        source: /404/
        destination: /fr/404
      - type: redirect
        source: /500
        destination: /fr/500
      - type: redirect
        source: /500/
        destination: /fr/500
      - type: redirect
        source: /about
        destination: /fr/a-propos
      - type: redirect
        source: /about/
        destination: /fr/a-propos
      - type: redirect
        source: /programs
        destination: /fr/programmes
      - type: redirect
        source: /programs/
        destination: /fr/programmes
      - type: redirect
        source: /resources
        destination: /fr/ressources
      - type: redirect
        source: /resources/
        destination: /fr/ressources
      - type: redirect
        source: /blog
        destination: /fr/blog
      - type: redirect
        source: /blog/
        destination: /fr/blog
    buildCommand: pnpm -r --filter "./packages/**" build && pnpm --filter @kraak/client run build:web && rm -rf public && mkdir -p public && cp -R apps/client/dist/web/browser/. public/
    envVars:
      - key: CLIENT_FEATURE_PARTICIPANT_AREA
        value: 'false'

  - type: web
    name: kraak-api-prod
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: APP_VERSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
