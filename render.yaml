# Configuration Render — déploiement de l'API NestJS via Docker
# Documentation : https://docs.render.com/blueprint-spec
#
# Deux services distincts :
#   - kraak-api-staging : auto-deploy sur push de la branche longue `staging`.
#                         La promotion `main -> staging` se fait par
#                         fast-forward manuel. Voir
#                         docs/decisions/ARC-08-staging-environment.md et
#                         docs/runbooks/STAGING_PROMOTION.md.
#   - kraak-api-prod    : autoDeploy: false ; déclenché uniquement par le
#                         workflow .github/workflows/release-prod.yml sur tag
#                         SemVer. Voir docs/decisions/ARC-07-prod-release-tag-based.md
#                         et docs/runbooks/RELEASE_PROD.md.

services:
  - type: web
    name: kraak-api-staging
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    branch: staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: APP_VERSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: kraak-api-prod
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    # Production : aucun déploiement automatique. Le workflow GitHub
    # release-prod.yml déclenche manuellement les déploiements via l'API Render
    # à chaque tag SemVer approuvé dans l'environnement GitHub `production`.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: APP_VERSION
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
