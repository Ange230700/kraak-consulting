<section class="kr-perf-section bg-brand-white py-10 lg:py-14">
  <div class="mx-auto max-w-6xl px-4 lg:px-6">
    <div
      class="rounded-card bg-brand-navy shadow-card px-6 py-10 md:px-10 md:py-12"
    >
      <p
        class="text-brand-cyan text-center text-xs font-semibold tracking-[0.2em] uppercase"
      >
        {{ previewSection.eyebrow }}
      </p>
      <h2
        class="text-brand-white mt-3 text-center text-3xl font-bold lg:text-4xl"
      >
        {{ previewSection.title }}
      </h2>

      <div class="mt-8 grid gap-8 md:grid-cols-3">
        @for (item of stats; track item.title) {
          <article class="flex flex-col items-center gap-3 text-center">
            <p
              class="text-brand-white text-5xl leading-tight font-semibold lg:text-6xl"
            >
              {{ item.title }}
            </p>
            <p
              class="text-brand-page max-w-xs text-base leading-relaxed lg:text-lg"
            >
              {{ item.label }}
            </p>
          </article>
        }
      </div>
    </div>
  </div>
</section>
