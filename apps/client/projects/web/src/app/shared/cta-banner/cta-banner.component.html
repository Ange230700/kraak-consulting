<aside class="py-16 lg:py-24">
  <div class="mx-auto max-w-5xl px-4 lg:px-6">
    <div
      class="from-brand-navy via-brand-blue to-brand-cyan text-brand-white shadow-brand-navy/20 overflow-hidden rounded-[3rem] bg-linear-to-r px-8 py-14 text-center shadow-2xl md:px-12 md:py-18 lg:px-20 lg:py-20"
    >
      <h2 class="text-3xl leading-tight font-black text-white md:text-5xl">
        {{ heading }}
      </h2>
      @if (body) {
        <p
          class="mx-auto mt-5 max-w-3xl text-base leading-7 text-white/90 md:text-lg"
        >
          {{ body }}
        </p>
      }

      <ng-content />

      @if (ctaLabel && ctaLink) {
        <a
          pButton
          [routerLink]="ctaLink"
          [attr.aria-label]="ctaLabel"
          (click)="onCtaClick()"
          class="bg-brand-white text-brand-navy hover:bg-brand-cyan hover:text-brand-white mt-8 inline-flex items-center justify-center rounded-2xl px-10 py-4 text-sm font-black tracking-widest uppercase shadow-xl transition-all duration-300"
        >
          {{ ctaLabel }}
        </a>
      }
    </div>
  </div>
</aside>
