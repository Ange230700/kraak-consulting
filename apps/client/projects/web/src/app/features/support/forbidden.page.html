<section
  class="bg-brand-page relative isolate min-h-screen overflow-hidden px-4 py-12 sm:px-6 lg:px-8"
>
  <div aria-hidden="true" class="absolute inset-0">
    <div
      class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(76,195,217,0.2),transparent_28%),radial-gradient(circle_at_bottom_right,rgba(28,78,134,0.24),transparent_34%),linear-gradient(180deg,#f3f3f3_0%,#ffffff_100%)]"
    ></div>
  </div>

  <div
    class="relative z-10 mx-auto flex min-h-[calc(100vh-6rem)] max-w-4xl items-center justify-center"
  >
    <div
      class="w-full rounded-[2rem] border border-slate-200/80 bg-white/95 px-6 py-10 text-center shadow-[0_1px_2px_rgba(164,172,185,0.18),0_28px_70px_-42px_rgba(18,43,74,0.32)] backdrop-blur-xl sm:px-10 lg:px-14 lg:py-14"
    >
      <p
        class="text-brand-blue text-sm font-semibold tracking-[0.2em] uppercase"
      >
        Accès refusé
      </p>
      <h1
        class="text-brand-navy mt-5 text-5xl font-semibold sm:text-6xl lg:text-7xl"
      >
        403
      </h1>
      <p class="text-brand-navy mx-auto mt-6 max-w-2xl text-lg leading-8">
        Vous n'avez pas les droits nécessaires pour consulter cette page.
        Contactez notre équipe si vous pensez qu'il s'agit d'une erreur.
      </p>

      <div class="mt-10 flex flex-col justify-center gap-3 sm:flex-row">
        <a
          pButton
          [routerLink]="'home' | localizedPublicPath"
          label="Retour à l'accueil"
          icon="pi pi-home"
          size="large"
          class="kr-button-primary"
          aria-label="Retour à la page d'accueil"
        >
          <span class="sr-only">Retour à la page d'accueil</span>
        </a>
        <a
          pButton
          [routerLink]="'contact' | localizedPublicPath"
          label="Nous contacter"
          icon="pi pi-envelope"
          size="large"
          class="kr-button-ghost"
          aria-label="Contacter KRAAK"
        >
          <span class="sr-only">Contacter KRAAK</span>
        </a>
      </div>
    </div>
  </div>
</section>
