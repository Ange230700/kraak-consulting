<header
  class="bg-brand-white/92 border-brand-blue/10 shadow-brand-navy/10 sticky top-0 z-50 border-b shadow-lg backdrop-blur-sm"
>
  <nav
    aria-label="Navigation principale"
    class="relative mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-4 lg:px-6"
  >
    <a
      routerLink="/"
      class="flex items-center gap-3 no-underline"
      (click)="closeMobileMenu()"
    >
      <img
        src="/kraak-symbol.png"
        alt="Symbole KRAAK"
        width="44"
        height="44"
        fetchpriority="high"
        loading="eager"
        decoding="async"
        class="h-11 w-11"
      />
      <span
        class="text-brand-navy text-lg leading-none font-bold tracking-tight"
      >
        KRAAK Consulting
      </span>
    </a>

    <div
      class="border-brand-blue/10 bg-brand-white absolute top-full left-0 z-50 w-full items-center justify-between border-t px-4 py-4 shadow-sm lg:static lg:flex lg:w-auto lg:grow lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none"
      [class.hidden]="!mobileMenuOpen()"
      [class.flex]="mobileMenuOpen()"
    >
      <ul
        class="flex grow flex-col gap-2 lg:flex-row lg:items-center lg:justify-center lg:gap-6"
      >
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="text-brand-navy after:scale-x-100"
              kraakPublicConversion="nav_cta_click"
              [kraakPublicConversionPayload]="{
                nav_label: link.label,
                nav_path: link.path,
                nav_surface: 'primary_nav',
              }"
              class="kr-nav-link uppercase"
              (click)="closeMobileMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="lg:hidden">
      <button
        type="button"
        class="border-brand-blue/25 bg-brand-white text-brand-navy hover:border-brand-blue/45 hover:bg-brand-cyan/8 shadow-brand-navy/20 inline-flex items-center justify-center rounded-(--kr-radius-btn) border px-3 py-3 shadow-xl transition-all hover:-translate-y-px"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Menu de navigation"
      >
        <i
          [class]="mobileMenuOpen() ? 'pi pi-times' : 'pi pi-bars'"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </nav>
</header>
