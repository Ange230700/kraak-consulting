version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Africa/Abidjan
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(workspace)'
    groups:
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Africa/Abidjan
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
