# Analyse SonarQube Cloud — kraak-group
# Déclenchée sur push vers main et sur les pull requests ciblant main.
# Nécessite les secrets : SONAR_TOKEN (token utilisateur SonarCloud).

name: SonarCloud

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Profondeur complète requise pour une analyse fiable (blame, etc.)
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm@10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Scan SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
