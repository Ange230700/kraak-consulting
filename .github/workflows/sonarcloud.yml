# Analyse SonarQube Cloud — kraak-group
# Déclenchée sur staging/main et leurs pull requests.
# Nécessite les secrets : SONAR_TOKEN (token utilisateur SonarCloud).

name: SonarCloud

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Profondeur complète requise pour une analyse fiable (blame, etc.)
          fetch-depth: 0

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Installer le moteur PDF pour les tests workspace
        run: pnpm exec playwright install --with-deps chromium

      - name: Contrôle qualité complet et couverture à 100 % par fichier
        run: pnpm check

      - name: Conserver les rapports de couverture
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            apps/api/coverage/
            apps/client/coverage/
            packages/*/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Scan SonarCloud
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        # pnpm sonar impose -Dsonar.qualitygate.wait=true.
        run: pnpm sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          # Requis pour la résolution du contexte PR et la décoration des pull requests
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
