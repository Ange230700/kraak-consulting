name: Observability

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  uptime-check:
    name: Uptime Check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            # Pas d'URL web staging stable (les previews Vercel changent a chaque commit
            # et le branch alias a la protection SSO activée). On utilise la meme home
            # production pour le check web ; la valeur distincte de ce job est le check
            # de l'API staging.
            web_url: https://kraak-consulting.vercel.app
            api_url: https://kraak-api-staging.onrender.com
            alert_issue_title: "[ALERT][DEP-05][staging] Observability check failure"
          - environment: production
            web_url: https://kraak-consulting.vercel.app
            api_url: https://kraak-api-prod.onrender.com
            alert_issue_title: "[ALERT][DEP-05][production] Observability check failure"
    env:
      KRAAK_OBSERVABILITY_ENVIRONMENT: ${{ matrix.environment }}
      KRAAK_OBSERVABILITY_WEB_URL: ${{ matrix.web_url }}
      KRAAK_OBSERVABILITY_API_URL: ${{ matrix.api_url }}
      ALERT_ISSUE_TITLE: ${{ matrix.alert_issue_title }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Execute observability checks
        id: observability
        continue-on-error: true
        run: node ./scripts/check-observability.mjs

      - name: Publish workflow summary
        if: always()
        run: |
          echo "## Observability (${KRAAK_OBSERVABILITY_ENVIRONMENT})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $KRAAK_OBSERVABILITY_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $KRAAK_OBSERVABILITY_API_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ steps.observability.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update alert issue on failure
        if: steps.observability.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ALERT_ISSUE_TITLE;
            const body = [
              '## Incident',
              '',
              '- Workflow: `Observability`',
              `- Environnement: ${process.env.KRAAK_OBSERVABILITY_ENVIRONMENT}`,
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Web cible: ${process.env.KRAAK_OBSERVABILITY_WEB_URL}`,
              `- API cible: ${process.env.KRAAK_OBSERVABILITY_API_URL}/health`,
              `- Détecté le: ${new Date().toISOString()}`,
              '',
              '## Action attendue',
              '',
              '1. Vérifier le statut Vercel et Render.',
              '2. Rejouer `pnpm check:observability` avec les mêmes URLs.',
              '3. Suivre le runbook DEP-05 / DEP-06 si le service reste indisponible.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const alertIssue = existing.find((issue) => issue.title === title);

            if (alertIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alertIssue.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });

      - name: Close alert issue after recovery
        if: steps.observability.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ALERT_ISSUE_TITLE;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const alertIssue = existing.find((issue) => issue.title === title);

            if (!alertIssue) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: alertIssue.number,
              body: [
                'Récupération détectée par le workflow `Observability`.',
                '',
                `Run vert: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: alertIssue.number,
              state: 'closed',
            });

      - name: Fail workflow when the checks fail
        if: steps.observability.outcome == 'failure'
        run: exit 1
