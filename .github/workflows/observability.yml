name: Observability

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  uptime-check:
    name: Uptime Check
    runs-on: ubuntu-latest
    env:
      KRAAK_OBSERVABILITY_WEB_URL: https://kraak-consulting-git-staging-ange230700s-projects.vercel.app
      KRAAK_OBSERVABILITY_API_URL: https://kraak-api-staging.onrender.com
      ALERT_ISSUE_TITLE: '[ALERT][DEP-05] Observability check failure'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute observability checks
        id: observability
        continue-on-error: true
        run: node ./scripts/check-observability.mjs

      - name: Publish workflow summary
        if: always()
        run: |
          echo '## Observability' >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: $KRAAK_OBSERVABILITY_WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $KRAAK_OBSERVABILITY_API_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ steps.observability.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update alert issue on failure
        if: steps.observability.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ALERT_ISSUE_TITLE;
            const body = [
              '## Incident',
              '',
              '- Workflow: `Observability`',
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Web cible: ${process.env.KRAAK_OBSERVABILITY_WEB_URL}`,
              `- API cible: ${process.env.KRAAK_OBSERVABILITY_API_URL}/health`,
              `- Detecte le: ${new Date().toISOString()}`,
              '',
              '## Action attendue',
              '',
              '1. Verifier le statut Vercel et Render.',
              '2. Rejouer `pnpm check:observability` avec les memes URLs.',
              '3. Suivre le runbook DEP-05 / DEP-06 si le service reste indisponible.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const alertIssue = existing.find((issue) => issue.title === title);

            if (alertIssue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: alertIssue.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });

      - name: Close alert issue after recovery
        if: steps.observability.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ALERT_ISSUE_TITLE;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const alertIssue = existing.find((issue) => issue.title === title);

            if (!alertIssue) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: alertIssue.number,
              body: [
                'Recuperation detectee par le workflow `Observability`.',
                '',
                `Run vert: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: alertIssue.number,
              state: 'closed',
            });

      - name: Fail workflow when the checks fail
        if: steps.observability.outcome == 'failure'
        run: exit 1
