name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/CHANGELOG.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Publish changesets and create git tags
  # ──────────────────────────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: bump versions and update changelogs'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish changesets
        id: publish
        run: |
          pnpm changesets:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: steps.publish.outcome == 'success'
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
