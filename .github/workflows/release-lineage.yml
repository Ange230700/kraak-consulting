name: Pull Request Branch Lineage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-lineage:
    name: Branch Lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Vérifier la branche cible
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "::error::Les PR doivent cibler main."
            exit 1
          fi

      - name: Vérifier que la branche courte contient main
        run: |
          git fetch origin main --no-tags
          node scripts/github/check-branch-lineage.mjs --require-main-ancestor HEAD origin/main
