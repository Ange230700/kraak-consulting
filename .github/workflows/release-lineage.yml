name: Release Branch Lineage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-lineage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-lineage:
    name: Branch Lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Vérifier la branche source de release
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" != "main" || "$HEAD_BRANCH" != "staging" || "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; then
            echo "::error::Seule une PR staging vers main depuis le dépôt courant peut promouvoir une release."
            exit 1
          fi

      - name: Vérifier la lignée main vers staging
        run: |
          git fetch origin main staging --no-tags
          node scripts/github/check-branch-lineage.mjs --require-main-ancestor origin/staging origin/main
