name: Provider Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Inventaire Render en lecture seule
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        with:
          script: |
            const token = process.env.RENDER_API_KEY;
            if (!token) throw new Error('RENDER_API_KEY manquant.');
            async function get(path) {
              const response = await fetch(`https://api.render.com/v1/${path}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!response.ok) throw new Error(`Render ${path.split('?')[0]} : HTTP ${response.status}`);
              return response.json();
            }
            async function list(path) {
              const records = [];
              let cursor = '';
              do {
                const page = await get(`${path}${path.includes('?') ? '&' : '?'}limit=100${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ''}`);
                if (!Array.isArray(page)) throw new Error('Pagination Render inattendue.');
                records.push(...page);
                cursor = page.length === 100 ? page.at(-1).cursor : '';
                if (page.length === 100 && !cursor) throw new Error('Curseur Render manquant.');
              } while (cursor);
              return records;
            }
            const services = await list('services');
            const associated = services.map(r => r.service).filter(s =>
              s.repo?.replace(/\.git$/, '').toLowerCase() === 'https://github.com/ange230700/kraak-consulting'
            );
            const report = [];
            for (const service of associated) {
              const env = await list(`services/${service.id}/env-vars`);
              const references = env.map(r => r.envVar).filter(v =>
                /^(SUPABASE_URL|CLIENT_SUPABASE_URL|CLIENT_API_BASE_URL|CLIENT_SITE_URL|APP_ENV|APP_VERSION|CORS_ALLOWED_ORIGINS|CORS_ALLOWED_ORIGIN_PATTERNS)$/.test(v.key)
              );
              const deploys = await get(`services/${service.id}/deploys?limit=5`);
              const domains = service.type === 'web_service' || service.type === 'static_site'
                ? await get(`services/${service.id}/custom-domains`) : [];
              report.push({
                id: service.id, name: service.name, ownerId: service.ownerId,
                type: service.type, repo: service.repo, branch: service.branch,
                autoDeploy: service.autoDeploy, suspended: service.suspended,
                region: service.serviceDetails?.region,
                plan: service.serviceDetails?.plan,
                diskId: service.serviceDetails?.disk?.id,
                url: service.serviceDetails?.url,
                references,
                environmentKeys: env.map(r => r.envVar.key),
                deploys: deploys.map(r => ({ id: r.deploy.id, status: r.deploy.status, commit: r.deploy.commit })),
                domains,
              });
            }
            core.info(JSON.stringify({ services: report }, null, 2));
            const owners = [...new Set(associated.map(s => s.ownerId))];
            for (const owner of owners) {
              for (const endpoint of ['postgres', 'key-value', 'disks', 'env-groups']) {
                const response = await fetch(`https://api.render.com/v1/${endpoint}?ownerId=${encodeURIComponent(owner)}&limit=100`, {
                  headers: { Authorization: `Bearer ${token}` },
                });
                if (!response.ok) {
                  core.warning(`${endpoint} (${owner}) : HTTP ${response.status}, inventaire incomplet.`);
                  continue;
                }
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Inventaire Render inattendu.');
                core.info(JSON.stringify({ owner, endpoint, resources: data.map(r => {
                  const value = r.postgres ?? r.keyValue ?? r.disk ?? r.envGroup;
                  return { id: value?.id, name: value?.name, ownerId: value?.ownerId, serviceId: value?.serviceId, plan: value?.plan, region: value?.region };
                }), truncated: data.length === 100 }));
              }
            }
