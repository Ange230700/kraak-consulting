# Pipeline CI — kraak-group monorepo
# Déclenché sur push vers main et sur les pull requests ciblant main.
# Couvre : format, lint, build, tests unitaires, tests E2E.

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Vérifications rapides : format + lint
  # ──────────────────────────────────────────────
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Vérifier le formatage (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

  # ──────────────────────────────────────────────
  # Build de production (web + mobile)
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Build web (production SSR)
        run: pnpm build:web

      - name: Build mobile (production)
        run: pnpm build:mobile

  # ──────────────────────────────────────────────
  # Tests unitaires (Vitest via Angular builder)
  # ──────────────────────────────────────────────
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Exécuter les tests unitaires
        run: pnpm test:unit

  # ──────────────────────────────────────────────
  # Tests scripts / workspace (Node --test)
  # ──────────────────────────────────────────────
  workspace:
    name: Workspace Checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Exécuter les tests workspace
        run: pnpm test:workspace

  # ──────────────────────────────────────────────
  # Validation Docker (build de l'image API)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Construire l'image Docker API
        run: docker build -f apps/api/Dockerfile -t kraak-api:ci .

  # ──────────────────────────────────────────────
  # Tests E2E (Playwright — Chromium)
  # ──────────────────────────────────────────────
  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: build
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Installer les navigateurs Playwright
        # Note: playwright install exécute une commande officielle Playwright (non pnpm install),
        # donc --ignore-scripts ne s'applique pas. Les dépendances système (--with-deps)
        # proviennent de distributions officielles et ne représentent pas un risque de sécurité.
        # NOSONAR
        run: |
          pnpm --filter @kraak/client exec playwright --version
          pnpm --filter @kraak/client exec playwright install --with-deps

      - name: Exécuter les tests E2E
        run: pnpm test:e2e:all

      - name: Sauvegarder les rapports Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Build debug APK Android (Capacitor + Gradle)
  # ──────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Build mobile & sync Android
        run: pnpm build:debug:android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug

      - name: Sauvegarder le debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
