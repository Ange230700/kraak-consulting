# Pipeline CI — kraak-group monorepo
# Déclenché sur push vers main et sur les pull requests ciblant main.
# Couvre : format, lint, build, tests unitaires.

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Vérifications rapides : format + lint
  # ──────────────────────────────────────────────
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Vérifier le formatage (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm -r lint

      - name: Lint Supabase lié
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_STAGING_PROJECT_REF:-}" ]]; then
            echo "Supabase secrets manquants: étape Splinter ignorée."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF"
          pnpm splinter:linked

  # ──────────────────────────────────────────────
  # Build de production (web + mobile)
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Build web (production SSR)
        run: pnpm build:web

      - name: Build mobile (production)
        run: pnpm build:mobile

  # ──────────────────────────────────────────────
  # Tests unitaires (Vitest via Angular builder)
  # ──────────────────────────────────────────────
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Exécuter les tests unitaires
        run: pnpm test:unit

  # ──────────────────────────────────────────────
  # Check E2E requis par la protection de branche
  # ──────────────────────────────────────────────
  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Installer les navigateurs Playwright
        run: echo "Utilisation du navigateur Chrome système du runner CI"

      - name: Exécuter les tests E2E web (Playwright)
        env:
          KRAAK_E2E_BASE_URL: http://127.0.0.1:4200
          KRAAK_E2E_START_WEB_SERVER: "false"
          CLIENT_API_BASE_URL: https://kraak-api-staging.onrender.com
          CLIENT_SITE_URL: http://127.0.0.1:4200
          KRAAK_E2E_BROWSER_CHANNEL: chrome
        run: |
          pnpm --filter @kraak/client build:web

          pnpm dlx serve -s apps/client/dist/web/browser -l 4200 >/tmp/kraak-e2e-serve.log 2>&1 &
          SERVER_PID=$!

          timeout 120 bash -c 'until curl -sf http://127.0.0.1:4200 >/dev/null; do sleep 2; done'

          set +e
          pnpm --filter @kraak/client exec playwright test --project=chromium
          TEST_EXIT_CODE=$?
          set -e

          kill -9 "$SERVER_PID" >/dev/null 2>&1 || true

          exit "$TEST_EXIT_CODE"

  # ──────────────────────────────────────────────
  # Tests scripts / workspace (Node --test)
  # ──────────────────────────────────────────────
  workspace:
    name: Workspace Checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Exécuter les tests workspace
        run: pnpm test:workspace

  # ──────────────────────────────────────────────
  # Validation Docker (build de l'image API)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Construire l'image Docker API
        run: docker build -f apps/api/Dockerfile -t kraak-api:ci .

  # ──────────────────────────────────────────────
  # Build debug APK Android (Capacitor + Gradle)
  # ──────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        run: npm install --ignore-scripts -g pnpm@10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Construire les packages workspace
        run: pnpm -r --filter "./packages/**" build

      - name: Build mobile & sync Android
        run: pnpm build:debug:android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug

      - name: Sauvegarder le debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
