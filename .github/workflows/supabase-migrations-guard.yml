name: Supabase Migrations Guard

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations-guard.yml'
      - 'scripts/check-supabase-migration-lineage.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-lineage
  cancel-in-progress: false

jobs:
  lineage:
    name: Production Migration Lineage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Pin trusted Supabase executable
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/trusted-supabase"
          install -m 0500 "$(command -v supabase)" "$RUNNER_TEMP/trusted-supabase/supabase"

      - name: Check production migration lineage
        env:
          SUPABASE_EXECUTABLE: ${{ runner.temp }}/trusted-supabase/supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION_READONLY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Secret production requis : SUPABASE_DB_URL_PRODUCTION_READONLY (lecture seule)."
            exit 1
          fi
          node scripts/check-supabase-migration-lineage.mjs
