name: Supabase Migrations Guard

on:
  push:
    branches: [staging, main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations-guard.yml'
      - 'scripts/check-supabase-migration-lineage.mjs'

concurrency:
  group: supabase-migrations-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Branch Mapping
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_environment: ${{ steps.map.outputs.target_environment }}
    steps:
      - name: Fail fast on unsupported events
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "Only push events are allowed for database applies."
            exit 1
          fi

      - name: Resolve environment from branch
        id: map
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            staging)
              echo "target_environment=staging" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "target_environment=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Branch '${GITHUB_REF_NAME}' is not allowed to apply Supabase migrations."
              exit 1
              ;;
          esac

  apply-migrations:
    name: Apply Supabase Migrations
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ needs.guard.outputs.target_environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Setup Node.js for production lineage
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Pin trusted Supabase executable
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/trusted-supabase"
          install -m 0500 "$(command -v supabase)" "$RUNNER_TEMP/trusted-supabase/supabase"

      - name: Check production migration lineage
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_EXECUTABLE: ${{ runner.temp }}/trusted-supabase/supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION_READONLY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::Secret production requis : SUPABASE_DB_URL_PRODUCTION_READONLY (lecture seule)."
            exit 1
          fi
          node scripts/check-supabase-migration-lineage.mjs

      - name: Validate environment-scoped secrets
        id: secrets
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
          PRODUCTION_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            if [[ -z "${STAGING_DB_URL}" ]]; then
              echo "Missing SUPABASE_DB_URL_STAGING in staging environment secrets."
              exit 1
            fi
            if [[ -n "${PRODUCTION_DB_URL}" ]]; then
              echo "SUPABASE_DB_URL_PRODUCTION must not be set in staging environment secrets."
              exit 1
            fi
            echo "target=staging" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            if [[ -z "${PRODUCTION_DB_URL}" ]]; then
              echo "Missing SUPABASE_DB_URL_PRODUCTION in production environment secrets."
              exit 1
            fi
            if [[ -n "${STAGING_DB_URL}" ]]; then
              echo "SUPABASE_DB_URL_STAGING must not be set in production environment secrets."
              exit 1
            fi
            echo "target=production" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported branch '${GITHUB_REF_NAME}'."
          exit 1

      - name: Apply migrations to mapped database
        shell: bash
        env:
          TARGET: ${{ steps.secrets.outputs.target }}
          STAGING_DB_URL: ${{ secrets.SUPABASE_DB_URL_STAGING }}
          PRODUCTION_DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ "${TARGET}" == "staging" ]]; then
            DB_URL="${STAGING_DB_URL}"
          else
            DB_URL="${PRODUCTION_DB_URL}"
          fi
          echo "Applying migrations to '${TARGET}' from branch '${GITHUB_REF_NAME}'."
          supabase db push --db-url "${DB_URL}"
