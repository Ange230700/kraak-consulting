project_id = "kraak-group"

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = [
  "http://localhost:4200/auth/callback",
  "http://localhost:4200/auth/reset",
  "http://localhost:4200/connexion",
  "http://localhost:4200/mot-de-passe-oublie",
  "http://localhost:4300/auth/callback",
  "http://localhost:4300/auth/reset",
  "http://localhost:4300/connexion",
  "http://localhost:4300/mot-de-passe-oublie",
  "https://kraak-web-staging.onrender.com/auth/callback",
  "https://kraak-web-staging.onrender.com/auth/reset",
  "https://kraak-web-staging.onrender.com/connexion",
  "https://kraak-web-staging.onrender.com/mot-de-passe-oublie",
  "https://kraak-web-prod.onrender.com/auth/callback",
  "https://kraak-web-prod.onrender.com/auth/reset",
  "https://kraak-web-prod.onrender.com/connexion",
  "https://kraak-web-prod.onrender.com/mot-de-passe-oublie",
  "kraak://auth/callback",
  "kraak://auth/reset",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "30s"

[auth.rate_limit]
email_sent = 30

[auth.email.template.confirmation]
subject = "Confirmez votre inscription KRAAK"
content_path = "./supabase/templates/auth/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe KRAAK"
content_path = "./supabase/templates/auth/recovery.html"

[analytics]
enabled = false

[storage.vector]
enabled = false

[storage.analytics]
enabled = false
